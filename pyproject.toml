[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lastfm_pg"
version = "0.2"
description = "Generate playlists from the top tracks listened by a lastfm user"
authors = [{name = "dbeley", email = "dbeley@protonmail.com"}]
license = {text = "GPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pylast>=7.1",
    "Mastodon.py>=2.2",
]

[project.urls]
Homepage = "https://github.com/dbeley/lastfm_pg"

[project.scripts]
lastfm_pg = "lastfm_pg.__main__:main"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]

[tool.coverage.run]
source = ["lastfm_pg"]
branch = true
